version: '2'

name: kubernetes-platform

services:
  app:
    build: .
    image: kubernetes-platform:app-0.1.0
    ports:
      - "127.0.0.1:20180:8080"
    volumes:
      - ./tests/fixtures/config:/app/config:ro
    networks:
      - kp

  tools:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    volumes:
      - .:/go/src/github.com/Alexsovich5/kubernetes-platform
    working_dir: /go/src/github.com/Alexsovich5/kubernetes-platform
    environment:
      KUBECONFIG: /go/src/github.com/Alexsovich5/kubernetes-platform/build/kubeconfig
      HELM_HOST: tiller:44134
    networks:
      - kp

  etcd:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    command:
      - etcd
      - --data-dir=/var/lib/etcd/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    networks:
      - kp

  apiserver:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    depends_on:
      - etcd
    command:
      - kube-apiserver
      - --etcd-servers=http://etcd:2379
      - --insecure-bind-address=0.0.0.0
      - --insecure-port=8080
      - --service-cluster-ip-range=10.0.0.0/24
      - --admission-control=NamespaceLifecycle,LimitRanger,ResourceQuota
    networks:
      - kp

  # kube-apiserver 1.2 health-checks these two at 127.0.0.1:10252 and
  # 127.0.0.1:10251, so they share the apiserver's network namespace.
  controller-manager:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    network_mode: "service:apiserver"
    depends_on:
      - apiserver
    command:
      - kube-controller-manager
      - --master=http://127.0.0.1:8080

  scheduler:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    network_mode: "service:apiserver"
    depends_on:
      - apiserver
    command:
      - kube-scheduler
      - --master=http://127.0.0.1:8080

  # Tiller keeps releases in memory and installs them into production.
  tiller:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    depends_on:
      - apiserver
    volumes:
      - .:/go/src/github.com/Alexsovich5/kubernetes-platform:ro
    environment:
      KUBECONFIG: /go/src/github.com/Alexsovich5/kubernetes-platform/build/kubeconfig
    command:
      - tiller
      - --listen
      - :44134
      - --namespace
      - production
    networks:
      - kp

  # Prometheus 0.20.0 from the release tarball installed in the tools image.
  # Its Kubernetes SD stops discovering if the first list against the
  # apiserver fails, so start it only once the apiserver answers.
  prometheus:
    image: kubernetes-platform:tools-2016
    entrypoint: []
    depends_on:
      - app
      - apiserver
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - bash
      - -c
      - >-
        until curl -fs -o /dev/null http://apiserver:8080/api/v1/pods; do sleep 1; done;
        exec prometheus
        -config.file=/etc/prometheus/prometheus-local.yml
        -storage.local.path=/prometheus
        -web.console.libraries=/usr/share/prometheus/console_libraries
        -web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:20190:9090"
    networks:
      - kp

networks:
  kp:
    ipam:
      config:
        - subnet: 172.41.0.0/24
