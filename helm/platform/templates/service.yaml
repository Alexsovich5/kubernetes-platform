apiVersion: v1
kind: Service
metadata:
  name: {{template "fullname" .}}
  labels:
    app: platform
    heritage: {{.Release.Service}}
    release: {{.Release.Name}}
spec:
  type: {{.service.type}}
  ports:
  - port: {{.service.port}}
    targetPort: {{.service.targetPort}}
    protocol: TCP
    name: http
  selector:
    app: platform
    tier: backend
    release: {{.Release.Name}}
